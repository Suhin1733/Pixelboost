      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download ncnn (Vulkan, Android)
        run: |
          curl -fL --retry 3 -o ncnn.zip https://github.com/Tencent/ncnn/releases/download/20240102/ncnn-20240102-android-vulkan.zip
          unzip -q ncnn.zip
          mv ncnn-20240102-android-vulkan app/src/main/cpp/ncnn
          ls app/src/main/cpp/ncnn

      - name: Download Real-ESRGAN models
        run: |
          mkdir -p app/src/main/assets/models
          for m in realesrgan-x4plus realesrgan-x4plus-anime realesr-animevideov3-x2 realesr-animevideov3-x3 realesr-animevideov3-x4; do
            for e in param bin; do
              curl -fL --retry 3 -o "app/src/main/assets/models/$m.$e" "https://raw.githubusercontent.com/xinntao/Real-ESRGAN-ncnn-vulkan/master/models/$m.$e"
              test -s "app/src/main/assets/models/$m.$e"
            done
          done
          ls -la app/src/main/assets/models

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PixelBoost-APK
          path: app/build/outputs/apk/debug/*.apk
