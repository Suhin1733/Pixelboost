          package com.pixelboost.app

          data class UpscaleModel(
              val id: String,
              val title: String,
              val description: String,
              val file: String,
              val nativeScale: Int
          )

          object Models {
              val all = listOf(
                  UpscaleModel("x4plus", "Real-ESRGAN x4 Plus (Photos)", "Best quality for real photos. Slower.", "realesrgan-x4plus", 4),
                  UpscaleModel("x4anime", "Real-ESRGAN x4 Plus Anime", "Best for drawings, anime and illustrations.", "realesrgan-x4plus-anime", 4),
                  UpscaleModel("fast4", "Fast x4 (AnimeVideo v3)", "Very fast and light. Good for quick results.", "realesr-animevideov3-x4", 4),
                  UpscaleModel("fast3", "Fast x3 (AnimeVideo v3)", "Very fast, 3x native.", "realesr-animevideov3-x3", 3),
                  UpscaleModel("fast2", "Fast x2 (AnimeVideo v3)", "Very fast, 2x native.", "realesr-animevideov3-x2", 2)
              )
          }

          enum class OutFormat(val label: String, val ext: String, val mime: String) {
              PNG("PNG", "png", "image/png"),
              JPG("JPG", "jpg", "image/jpeg"),
              WEBP("WEBP", "webp", "image/webp")
          }

          val SCALE_OPTIONS = listOf(2, 3, 4, 8)
          val TILE_OPTIONS = listOf(32, 64, 100, 128, 200)

          fun tileLabel(t: Int): String = when (t) {
              32 -> "32 - lowest memory"
              100 -> "100 - recommended"
              200 -> "200 - fastest (needs more RAM)"
              else -> "$t"
          }

          data class UpscaleSettings(
              val model: UpscaleModel = Models.all[0],
              val targetScale: Int = 4,
              val tile: Int = 100,
              val format: OutFormat = OutFormat.PNG,
              val useGpu: Boolean = true
          )

          enum class Status { Queued, Working, Done, Failed, Cancelled }

          data class Item(
              val id: Long,
              val uri: android.net.Uri,
              val name: String,
              val status: Status = Status.Queued,
              val progress: Float = 0f,
              val message: String? = null,
              val savedUri: android.net.Uri? = null
          )
