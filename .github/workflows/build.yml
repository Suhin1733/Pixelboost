          package com.pixelboost.app

          import android.content.res.AssetManager
          import android.graphics.Bitmap

          fun interface ProgressCallback {
              /** Return false to cancel. */
              fun onProgress(done: Int, total: Int): Boolean
          }

          object NativeUpscaler {
              init {
                  System.loadLibrary("pixelboost")
              }

              external fun gpuCount(): Int

              /** @return 0 = ok, -2 = cancelled, anything else = error */
              external fun upscale(
                  assets: AssetManager,
                  model: String,
                  scale: Int,
                  tile: Int,
                  useGpu: Boolean,
                  input: Bitmap,
                  output: Bitmap,
                  hasAlpha: Boolean,
                  callback: ProgressCallback
              ): Int
          }
