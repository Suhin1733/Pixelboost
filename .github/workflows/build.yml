          package com.pixelboost.app

          import android.app.Application
          import android.net.Uri
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.launch

          class MainViewModel(app: Application) : AndroidViewModel(app) {

              private val appContext = app.applicationContext
              private val engine = UpscaleEngine(appContext)
              private var nextId = 1L

              private val _items = MutableStateFlow<List<Item>>(emptyList())
              val items: StateFlow<List<Item>> = _items.asStateFlow()

              private val _settings = MutableStateFlow(UpscaleSettings())
              val settings: StateFlow<UpscaleSettings> = _settings.asStateFlow()

              private val _running = MutableStateFlow(false)
              val running: StateFlow<Boolean> = _running.asStateFlow()

              val gpuAvailable: Boolean = runCatching { NativeUpscaler.gpuCount() > 0 }.getOrDefault(false)

              init {
                  if (!gpuAvailable) _settings.update { it.copy(useGpu = false) }
              }

              fun updateSettings(f: (UpscaleSettings) -> UpscaleSettings) {
                  _settings.update(f)
              }

              fun addImages(uris: List<Uri>) {
                  if (uris.isEmpty()) return
                  val existing = _items.value.map { it.uri }.toSet()
                  val newItems = uris.filter { it !in existing }.map {
                      Item(id = nextId++, uri = it, name = ImageIO.displayName(appContext, it))
                  }
                  _items.update { it + newItems }
              }

              fun removeItem(id: Long) {
                  _items.update { list -> list.filter { it.id != id } }
              }

              fun clearAll() {
                  if (_running.value) return
                  _items.value = emptyList()
              }

              fun cancel() {
                  engine.cancelled = true
              }

              private fun patch(id: Long, f: (Item) -> Item) {
                  _items.update { list -> list.map { if (it.id == id) f(it) else it } }
              }

              fun start() {
                  if (_running.value) return
                  val s = _settings.value
                  engine.cancelled = false
                  _running.value = true
                  viewModelScope.launch(Dispatchers.Default) {
                      try {
                          val queue = _items.value.filter { it.status != Status.Done }.map { it.id }
                          for (id in queue) {
                              if (engine.cancelled) break
                              val item = _items.value.firstOrNull { it.id == id } ?: continue
                              patch(id) { it.copy(status = Status.Working, progress = 0f, message = null) }
                              try {
                                  val bmp = ImageIO.decode(appContext, item.uri)
                                      ?: throw UpscaleException("Cannot read this image")
                                  val hasAlpha = bmp.hasAlpha()
                                  val out = engine.upscale(bmp, s) { p -> patch(id) { it.copy(progress = p) } }
                                  bmp.recycle()
                                  val base = item.name.substringBeforeLast('.', item.name) + "_x${s.targetScale}"
                                  val saved = ImageIO.save(appContext, out.bitmap, base, s.format, hasAlpha)
                                  val dims = "${out.bitmap.width} x ${out.bitmap.height}"
                                  out.bitmap.recycle()
                                  val msg = dims + (out.note?.let { " ($it)" } ?: "")
                                  patch(id) { it.copy(status = Status.Done, progress = 1f, savedUri = saved, message = msg) }
                              } catch (e: CancelledException) {
                                  patch(id) { it.copy(status = Status.Cancelled, progress = 0f) }
                              } catch (e: Throwable) {
                                  patch(id) {
                                      it.copy(status = Status.Failed, message = e.message ?: e.javaClass.simpleName)
                                  }
                              }
                          }
                      } finally {
                          _running.value = false
                      }
                  }
              }
          }
