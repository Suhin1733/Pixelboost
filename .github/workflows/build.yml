                  value = withContext(Dispatchers.IO) {
                      try {
                          ImageIO.decode(context, item.uri, 200)?.asImageBitmap()
                      } catch (e: Throwable) {
                          null
                      }
                  }
              }
              Card(Modifier.fillMaxWidth()) {
                  Row(
                      Modifier.padding(10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Box(
                          Modifier
                              .size(64.dp)
                              .clip(RoundedCornerShape(8.dp))
                              .background(MaterialTheme.colorScheme.surfaceVariant)
                      ) {
                          thumb?.let {
                              Image(
                                  bitmap = it,
                                  contentDescription = null,
                                  modifier = Modifier.size(64.dp),
                                  contentScale = ContentScale.Crop
                              )
                          }
                      }
                      Column(Modifier.weight(1f)) {
                          Text(item.name, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.Medium)
                          Text(
                              statusText(item),
                              style = MaterialTheme.typography.bodySmall,
                              color = if (item.status == Status.Failed) MaterialTheme.colorScheme.error
                              else MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          if (item.status == Status.Working) {
                              LinearProgressIndicator(
                                  progress = { item.progress },
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(top = 6.dp)
                              )
                          }
                      }
                      if (item.status == Status.Done) {
                          TextButton(onClick = onCompare) { Text("Compare") }
                      }
                      if (item.status != Status.Working) {
                          IconButton(onClick = onRemove) { Icon(Icons.Default.Close, contentDescription = "Remove") }
                      }
                  }
              }
          }

          private fun statusText(item: Item): String = when (item.status) {
              Status.Queued -> "Waiting"
              Status.Working -> "Upscaling... ${(item.progress * 100).toInt()}%"
              Status.Done -> "Saved - ${item.message ?: ""}"
              Status.Failed -> "Failed: ${item.message ?: "unknown error"}"
              Status.Cancelled -> "Cancelled"
          }
          PB_END_OF_FILE
          mkdir -p 'app/src/main/java/com/pixelboost/app'
          cat > 'app/src/main/java/com/pixelboost/app/UpscaleEngine.kt' <<'PB_END_OF_FILE'
          package com.pixelboost.app

          import android.content.Context
          import android.graphics.Bitmap
          import kotlin.math.max
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          class CancelledException : Exception()
          class UpscaleException(message: String) : Exception(message)

          class UpscaleEngine(private val context: Context) {

              @Volatile
              var cancelled = false

              data class Output(val bitmap: Bitmap, val note: String?)

              private class Ctx(
                  val settings: UpscaleSettings,
                  val hasAlpha: Boolean,
                  val passTotal: Int,
                  val onProgress: (Float) -> Unit
              ) {
                  var passDone = 0
              }

              fun upscale(input: Bitmap, settings: UpscaleSettings, onProgress: (Float) -> Unit): Output {
                  val n = settings.model.nativeScale
                  val target = settings.targetScale.toFloat()
                  val peak = max(target, n.toFloat())

                  var src = input
                  var note: String? = null
                  val peakPixels = src.width.toDouble() * src.height * peak * peak
                  if (peakPixels > MAX_PIXELS) {
                      val f = sqrt(MAX_PIXELS / peakPixels)
                      val nw = max(16, (src.width * f).toInt())
                      val nh = max(16, (src.height * f).toInt())
                      src = Bitmap.createScaledBitmap(input, nw, nh, true)
                      note = "input reduced to fit phone memory"
                  }

                  val ctx = Ctx(settings, input.hasAlpha(), countPasses(target, n), onProgress)
                  try {
                      val result = run(src, target, n, ctx)
                      if (src !== input) src.recycle()
                      return Output(result, note)
                  } catch (e: OutOfMemoryError) {
                      throw UpscaleException("Not enough memory. Use a smaller image or a lower scale.")
                  }
              }

              private fun countPasses(t: Float, n: Int): Int = if (t > n) 1 + countPasses(t / n, n) else 1

              /** Returns [src] upscaled by exactly [target] (rounded to whole pixels). */
              private fun run(src: Bitmap, target: Float, n: Int, ctx: Ctx): Bitmap {
                  val base = if (target > n) run(src, target / n, n, ctx) else src
                  val out = nativePass(base, n, ctx)
                  if (base !== src) base.recycle()
                  val tw = max(1, (src.width * target).roundToInt())
                  val th = max(1, (src.height * target).roundToInt())
                  if (out.width == tw && out.height == th) return out
                  val resized = Bitmap.createScaledBitmap(out, tw, th, true)
                  if (resized !== out) out.recycle()
                  return resized
              }

              private fun nativePass(inp: Bitmap, n: Int, ctx: Ctx): Bitmap {
                  val s = ctx.settings
                  val out = Bitmap.createBitmap(inp.width * n, inp.height * n, Bitmap.Config.ARGB_8888)
                  if (ctx.hasAlpha) out.isPremultiplied = false

                  val gpuOk = s.useGpu && NativeUpscaler.gpuCount() > 0
                  val attempts = buildList<Pair<Int, Boolean>> {
                      if (gpuOk) {
                          var t = s.tile
                          while (t >= 32) {
                              add(t to true)
                              t /= 2
                          }
                      }
                      add(minOf(s.tile, 64).coerceAtLeast(32) to false)
                  }

                  for ((tile, gpu) in attempts) {
                      if (cancelled) throw CancelledException()
                      val cb = ProgressCallback { done, total ->
                          ctx.onProgress((ctx.passDone + done.toFloat() / total) / ctx.passTotal)
                          !cancelled
                      }
                      val rc = NativeUpscaler.upscale(
                          context.assets, s.model.file, n, tile, gpu, inp, out, ctx.hasAlpha, cb
                      )
                      if (rc == 0) {
                          ctx.passDone++
                          return out
                      }
                      if (rc == -2) throw CancelledException()
                  }
                  out.recycle()
                  throw UpscaleException("AI engine failed (GPU or memory). Try a smaller tile size or turn off GPU.")
              }

              companion object {
                  private const val MAX_PIXELS = 30_000_000.0
              }
          }
          PB_END_OF_FILE
          mkdir -p 'app/src/main/res/drawable'
          cat > 'app/src/main/res/drawable/ic_launcher_foreground.xml' <<'PB_END_OF_FILE'
